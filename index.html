<!doctype html>
<html lang="en-GB">
<head>

  <title>L Gym Plan</title>
  <meta name="description" content="A gentle, flexible exercise plan and logger.">
  <meta name="theme-color" content="#0e4f5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

<body>
  <main id="screen" aria-live="polite"></main>

    <button data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
